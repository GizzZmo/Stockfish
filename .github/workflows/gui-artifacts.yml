name: GUI Artifacts

on:
  push:
    branches: [master]
    paths:
      - 'matrix-gui/**'
      - 'neuralchess-pwa/**'
      - 'Avalonia UI/**'
      - '.github/workflows/gui-artifacts.yml'
  pull_request:
    branches: [master]
    paths:
      - 'matrix-gui/**'
      - 'neuralchess-pwa/**'
      - 'Avalonia UI/**'
      - '.github/workflows/gui-artifacts.yml'
  workflow_dispatch:

concurrency:
  group: gui-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix-gui:
    name: Matrix GUI (Electron / React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: matrix-gui/package-lock.json

      - name: Install dependencies
        working-directory: matrix-gui
        run: npm ci || npm install

      - name: Build React production assets
        working-directory: matrix-gui
        run: npm run build
        env:
          CI: true

      - name: Package web build
        run: |
          mkdir -p artifacts/matrix-gui
          cp -r matrix-gui/build/* artifacts/matrix-gui/
          cat > artifacts/matrix-gui/BUILD_INFO.txt << EOF
          Matrix GUI – Stockfish Cyberpunk Interface
          Commit: ${{ github.sha }}
          Branch: ${{ github.ref_name }}
          Built: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          Workflow: ${{ github.run_id }}
          EOF

      - name: Upload Matrix GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: matrix-gui-web-${{ github.sha }}
          path: artifacts/matrix-gui/
          retention-days: 30
          if-no-files-found: error

  neuralchess-pwa:
    name: NeuralChess PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # No package-lock.json in neuralchess-pwa yet — skip npm cache
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: neuralchess-pwa
        run: npm install

      - name: Build PWA
        working-directory: neuralchess-pwa
        run: npm run build
        env:
          CI: true

      - name: Package PWA build
        run: |
          mkdir -p artifacts/neuralchess-pwa
          if [ -d neuralchess-pwa/dist ]; then
            cp -r neuralchess-pwa/dist/* artifacts/neuralchess-pwa/
          elif [ -d neuralchess-pwa/build ]; then
            cp -r neuralchess-pwa/build/* artifacts/neuralchess-pwa/
          else
            echo "No build output found"
            ls -la neuralchess-pwa/
            exit 1
          fi
          cat > artifacts/neuralchess-pwa/BUILD_INFO.txt << EOF
          NeuralChess PWA – Stockfish Web Interface
          Commit: ${{ github.sha }}
          Branch: ${{ github.ref_name }}
          Built: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          Workflow: ${{ github.run_id }}
          EOF

      - name: Upload NeuralChess PWA artifact
        uses: actions/upload-artifact@v4
        with:
          name: neuralchess-pwa-${{ github.sha }}
          path: artifacts/neuralchess-pwa/
          retention-days: 30
          if-no-files-found: error
